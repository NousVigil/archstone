# reporting.list-accounts — implementation binding. NOT CDL
#
# Generated by `archstone init` from postgres catalog via REPORTING_DSN (postgres adapter).
# Review before committing: every mapped line names where it came from, and the names and
# descriptions are exactly the parts no tool can infer for you.

binding:
  capabilityId: reporting.list-accounts
  # A list, bounded by a literal LIMIT 100 you can read here.
  # Whose rows these are is not a field in this file: the caller's identity reaches the database as a
  # session setting that row-level security reads. Delete the policy and the isolation test goes red.
  connector:
    type: sql
    sql:
      engine: postgres
      dsn: "${REPORTING_DSN}"
      statementKind: select
      query: |
        SELECT "id", "name", "balance", "active", "opened_at"
        FROM "app"."accounts"
        LIMIT 100
      params: []

  # Provider body → reporting.Account. The resource is the anchor; these JSONPaths are the
  # only thing that moves if the backend renames a field. A required field that is missing or
  # null is a contract VIOLATION; an optional one DEGRADES.
  response:
    collection: "$[*]"
    resource: reporting.Account
    map:
      id: "$.id"  # declared app.accounts.id
      name: "$.name"  # declared app.accounts.name
      balance: "$.balance"  # declared app.accounts.balance
      active: "$.active"  # declared app.accounts.active
      opened_at: "$.opened_at"  # declared app.accounts.opened_at
