# reporting.list-accounts — business shape only, no HTTP
#
# Generated by `archstone init` from postgres catalog via REPORTING_DSN (postgres adapter).
# Review before committing: every mapped line names where it came from, and the names and
# descriptions are exactly the parts no tool can infer for you.

capability:
  id: reporting.list-accounts
  description: Read rows of the table app.accounts.
  effect: read  # confirmed at the gate — never inferred

  output:
    accounts:
      collection: reporting.Account

  provider: harborline-db
