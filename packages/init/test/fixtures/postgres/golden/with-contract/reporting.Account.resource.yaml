# reporting.Account — name supplied at the gate
#
# Generated by `archstone init` from postgres catalog via REPORTING_DSN (postgres adapter).
# Review before committing: every mapped line names where it came from, and the names and
# descriptions are exactly the parts no tool can infer for you.

resource:
  name: reporting.Account
  fields:
    id:
      type: identifier
    name:
      type: string
    balance:
      type: quantity
      required: false
      # nullable, so optional here (a null maps like a missing value)
    active:
      type: boolean
    opened_at:
      type: datetime
