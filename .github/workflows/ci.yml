name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the `*.integration.test.ts` suites that need a real database
    # (providers/sql, runtime's verify isolation test, and the CLI's `verify` end to end). This is
    # the CURRENT major (18); `postgres-compat` below runs the same suites against an older
    # supported one. Locally those suites skip themselves when ARCHSTONE_TEST_PG_URL is unset, but
    # under CI (GitHub sets CI=true) an unset URL or an unreachable server FAILS them — they are
    # never silently skipped here. The credentials are container-local and exist only for this
    # job — not a secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: archstone-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          ARCHSTONE_TEST_PG_URL: postgres://postgres:archstone-ci@localhost:5432/postgres

      # The repo-root release tooling uses Node's built-in runner, outside the Vitest workspace,
      # so `pnpm test` does not reach it. Before this ran on PRs, a broken release list or a
      # misnamed changelog.d fragment was first caught by release.yml, after the tag existed.
      #
      # release-gate.postgres.test.mjs (#162) is among them and needs the job's Postgres: it runs
      # the gate's sql-reporting verify leg against the workspace CLI, green and with isolation
      # removed from the fixture, so the leg is shown to fail when it should.
      - name: Release script tests
        run: node --test scripts/*.test.mjs
        env:
          ARCHSTONE_TEST_PG_URL: postgres://postgres:archstone-ci@localhost:5432/postgres

      # #162 — release.yml's gate runs on dispatch/tag only, so an example whose `verify` needs an
      # input the gate does not supply (an identity map, a database) was first found by a failed
      # release. This runs the gate's own per-manifest build + verify legs — same discovery, same
      # inputs, same code — against the workspace build `pnpm test` produced above. Packaging is
      # still proven only by the release run; what this adds is that every example's verify leg
      # passes with what the gate gives it, on every PR.
      - name: Release gate manifest legs (workspace build)
        run: node scripts/release-gate.mjs --workspace
        env:
          ARCHSTONE_TEST_PG_URL: postgres://postgres:archstone-ci@localhost:5432/postgres

  # The same real-Postgres suites against the oldest major we support (16), so a behaviour that
  # differs between majors — catalog visibility, error precedence, role-membership semantics —
  # fails here rather than at a user's database. Only the integration files run: everything else
  # is already covered by `build` above. Same mandatory-in-CI rule: no URL, or no server, fails.
  postgres-compat:
    name: postgres-compat (16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: archstone-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test against Postgres 16
        run: pnpm test:postgres
        env:
          ARCHSTONE_TEST_PG_URL: postgres://postgres:archstone-ci@localhost:5432/postgres

  # The two jobs below judge the release notes: release-prepare.mjs folds the changelog.d/
  # fragments into CHANGELOG.md's "## [Unreleased]", renames that heading to "## [X.Y.Z]", and
  # release.yml publishes that section verbatim as the GitHub Release body. So what a PR writes
  # there — or fails to — is what the next release announces.
  #
  # Pull requests only. Everything reaches main as a squash-merged PR, and branch protection
  # judges the PR, so that is where a missing entry has to be caught; a check on the push to
  # main would report after the fact, on a commit nobody can amend. Base and head are the PR's
  # own SHAs, not `github.sha` — on `pull_request` that is a synthetic merge commit whose
  # first-parent range would include whatever else landed on main meanwhile.

  changelog-entry:
    name: changelog entry or waiver
    # Every PR either adds a changelog.d/ fragment (or a CHANGELOG.md line) or says, in a `Changelog: none — <reason>` trailer
    # (on a commit or in the PR description), why a user of the published packages would not
    # notice. See scripts/check-changelog-entry.mjs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read     # to re-read the PR description; see the step below
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check the pull request's range
        # The PR description reaches the script through the environment and nothing else. It is
        # text anyone opening a PR controls; `${{ }}`-interpolating it into `run:` would make it
        # shell source.
        #
        # It is re-read from the API rather than taken only from the event payload, because
        # "Re-run job" replays the ORIGINAL payload: a contributor who adds the waiver to the
        # description after the check failed would otherwise re-run it against the old text
        # forever. The payload's copy is the fallback if the API call fails.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if LIVE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null); then
            export PR_BODY="$LIVE"
          else
            echo "::warning::could not re-read the PR description; using the copy from the event payload."
            export PR_BODY="$EVENT_BODY"
          fi
          node scripts/check-changelog-entry.mjs "$BASE" "$HEAD"

  changelog-history:
    name: released changelog sections are unchanged
    # A "## [x.y.z]" section that already existed at the merge base must still say exactly what it
    # said. The failure it catches is silent: a branch writes under "## [Unreleased]", a release
    # renames that heading on main, and the rebase reattaches the branch's lines under the
    # released heading with no conflict and nothing visible in the diff — so a shipped version
    # appears to contain work that landed after it. See scripts/check-changelog-history.mjs; a
    # deliberate correction is declared with a `Changelog-correction: <x.y.z> — <why>` trailer.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check the pull request's range
        # PR description handling as in `changelog-entry` above, for the same two reasons.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if LIVE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null); then
            export PR_BODY="$LIVE"
          else
            echo "::warning::could not re-read the PR description; using the copy from the event payload."
            export PR_BODY="$EVENT_BODY"
          fi
          node scripts/check-changelog-history.mjs "$BASE" "$HEAD"
