capability:
  id: wanderlust.search
  description: "Find places to stay matching a traveler's destination, dates, party and budget. Results come in the agency's own order; nothing here ranks them."
  effect: read

  input:
    destination:
      type: location
      description: "The city name, e.g. Lisbon or Porto, optionally followed by its country after a comma; or the exact name of one stay, e.g. Pensão Azul, to look at that stay only."
    dates:
      type: date-range
      description: "Check-in and check-out as ISO dates (YYYY-MM-DD), 1 to 30 nights. Work out calendar dates yourself; prose such as 'next weekend' is refused."
    travelers:
      type: party
    budget:
      type: money
      required: false
      description: "Maximum nightly rate as an object {amount, currency}, currency always \"EUR\" (a per-night ceiling, not a total for the stay). Not a bare number."
    preferences:
      type: preference-set
      required: false
      description: "Optional tags, all of which a stay must satisfy: pets (also pet-friendly, cat, dog), breakfast, family. Other tags are ignored."

  output:
    stays:
      collection: Stay
    totalMatches:
      type: quantity
      description: "How many stays the agency found."

  provider: wanderlust-api
