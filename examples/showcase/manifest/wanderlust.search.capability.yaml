capability:
  id: wanderlust.search
  description: "Find places to stay matching a traveler's destination, dates, party and budget. Results come in the agency's own order; nothing here ranks them."
  effect: read

  input:
    destination:
      type: location
    dates:
      type: date-range
    travelers:
      type: party
    budget:
      type: money
      required: false
      description: "Maximum nightly rate in EUR (a per-night ceiling, not a total for the stay)."
    preferences:
      type: preference-set
      required: false
      description: "Optional tags, all of which a stay must satisfy: pets (also pet-friendly, cat, dog), breakfast, family. Other tags are ignored."

  output:
    stays:
      collection: Stay
    totalMatches:
      type: quantity
      description: "How many stays the agency found."

  provider: wanderlust-api
