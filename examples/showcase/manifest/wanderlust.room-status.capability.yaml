capability:
  id: wanderlust.room-status
  description: "Is a property's room free on a date? Some rows may come back as errors when the agency's system is busy."
  effect: read

  input:
    propertyId:
      type: identifier
      description: "The stay's id: the `id` field of a row returned by wanderlust_search (it looks like `ws-1001`), never the stay's name. To find a stay the user names, first call wanderlust_search with that name as `destination`."
    date:
      type: date

  output:
    rooms:
      collection: RoomStatus

  provider: wanderlust-api
