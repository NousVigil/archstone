capability:
  id: wanderlust.quote
  description: "Price a stay for given dates and party. The quote expires; it books nothing and charges nothing."
  effect: write

  input:
    stayId:
      type: identifier
      description: "A stay id from wanderlust.search."
    dates:
      type: date-range
      description: "Check-in and check-out as ISO dates (YYYY-MM-DD), 1 to 30 nights. Work out calendar dates yourself; prose such as 'next weekend' is refused."
    travelers:
      type: party

  output:
    quote:
      type: Quote

  provider: wanderlust-api
