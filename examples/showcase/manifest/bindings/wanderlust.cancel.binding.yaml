# Implementation binding - how wanderlust.cancel reaches the synthetic agency. NOT CDL.
binding:
  capabilityId: wanderlust.cancel
  connector:
    type: rest
    rest:
      baseUrl: "${SHOWCASE_API_URL}"
      method: POST
      path: /v1/bookings/{bookingId}/cancel
      headers:
        Authorization: "Bearer ${caller.accessToken}"

  response:
    resource: Cancellation
    map:
      bookingId: "$.bookingId"
      status: "$.status"
      refund: "$.refund"
      cancelledAt: "$.cancelledAt"
