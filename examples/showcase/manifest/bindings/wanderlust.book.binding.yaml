# Implementation binding - how wanderlust.book reaches the synthetic agency. NOT CDL.
binding:
  capabilityId: wanderlust.book
  connector:
    type: rest
    rest:
      baseUrl: "${SHOWCASE_API_URL}"
      method: POST
      path: /v1/bookings
      headers:
        Authorization: "Bearer ${caller.accessToken}"

  response:
    resource: Booking
    map:
      bookingId: "$.bookingId"
      status: "$.status"
      stayId: "$.stayId"
      dates: "$.dates"
      total: "$.total"
      paymentQuote: "$.paymentQuote"
      payBy: "$.payBy"
