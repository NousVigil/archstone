# Implementation binding - how wanderlust.pay reaches the synthetic agency. NOT CDL.
binding:
  capabilityId: wanderlust.pay
  connector:
    type: rest
    rest:
      baseUrl: "${SHOWCASE_API_URL}"
      method: POST
      path: /v1/payments
      headers:
        Authorization: "Bearer ${caller.accessToken}"

  response:
    resource: Payment
    map:
      paymentId: "$.paymentId"
      bookingId: "$.bookingId"
      status: "$.status"
      amount: "$.amount"
      paidAt: "$.paidAt"
