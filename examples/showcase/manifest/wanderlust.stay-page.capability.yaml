capability:
  id: wanderlust.stay-page
  description: "The pages where a person can see a stay. The agency's own page is returned with its link; a partner listing on another site is still listed by name, but its link is withheld, because Archstone only passes on links on the origins the manifest declares."
  effect: read

  input:
    stayId:
      type: identifier
      description: "A stay id from wanderlust.search."

  output:
    pages:
      collection: HotelPage

  provider: wanderlust-api
