capability:
  id: wanderlust.pay
  description: "Pay for a booking with the demo card. This cannot be undone. Needs the agency key and a principal the manifest's policy allows: Archstone's policy refuses a missing key or a caller who is not allowed before the agency is asked. It also needs the payment quote the agency returned with the booking; the agency, not Archstone, checks it. A person must approve it first: ask with wanderlust.request-payment-approval, wait with wanderlust.approval-status, then pass the approval id. Archstone refuses the call unless the agency's approvals system answers that this approval allows this payment, and the agency uses the approval up when it does."
  effect: irreversible

  input:
    bookingId:
      type: identifier
      description: "The booking reference from wanderlust.book."
    amount:
      type: money
      description: "The amount the booking total was quoted at."
    paymentQuote:
      type: identifier
      description: "The payment quote returned with the booking, still valid."
    approval:
      ref: Approval
      description: "The id of an approved approval from wanderlust.request-payment-approval, for this same booking, amount and payment quote."

  output:
    payment:
      type: Payment

  failures:
    payment-quote-required: No payment quote was given.
    payment-quote-expired: The payment quote has expired.
    payment-quote-mismatch: The payment quote was issued for a different booking or amount.
    booking-not-found: No booking has that reference.

  policies:
    - authenticated
    - human-approval
  provider: wanderlust-api
