capability:
  id: wanderlust.availability
  description: "How many rooms a property has free on a date. Archstone's policy allows 3 calls per minute per caller and refuses the rest."
  effect: read

  input:
    propertyId:
      type: identifier
      description: "The stay's id: the `id` field of a row returned by wanderlust_search (it looks like `ws-1001`), never the stay's name. To find a stay the user names, first call wanderlust_search with that name as `destination`."
    date:
      type: date

  output:
    availability:
      type: Availability

  lifecycle: beta
  provider: wanderlust-api
