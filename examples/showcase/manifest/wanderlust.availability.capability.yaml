capability:
  id: wanderlust.availability
  description: "How many rooms a property has free on a date. Archstone's policy allows 3 calls per minute per caller and refuses the rest."
  effect: read

  input:
    propertyId:
      type: identifier
      description: "A stay id from wanderlust.search."
    date:
      type: date

  output:
    availability:
      type: Availability

  lifecycle: beta
  provider: wanderlust-api
