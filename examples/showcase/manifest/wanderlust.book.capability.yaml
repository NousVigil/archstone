capability:
  id: wanderlust.book
  description: "Book a quoted stay for a guest at the quoted total. Needs the agency key and a principal the manifest's policy allows: Archstone's policy refuses a missing key or a caller who is not allowed before the agency is asked; the agency then checks the key and the quote."
  effect: write

  input:
    quoteId:
      type: identifier
      description: "The quote id from wanderlust.quote, still valid."
    stayId:
      type: identifier
      description: "The stay's id: the `id` field of a row returned by wanderlust_search (it looks like `ws-1001`), never the stay's name. To find a stay the user names, first call wanderlust_search with that name as `destination`."
    dates:
      type: date-range
    travelers:
      type: party
    guestName:
      type: string
      description: "Who the booking is for."

  output:
    booking:
      type: Booking

  failures:
    quote-expired: The quote has expired; request a new one with wanderlust.quote.
    quote-mismatch: The quote was issued for a different stay, dates or party.

  policies:
    - authenticated
  provider: wanderlust-api
