# Implementation binding for the mis-declared variant. NOT CDL. No caller credential is forwarded.
binding:
  capabilityId: wanderlust.pay
  connector:
    type: rest
    rest:
      baseUrl: "${SHOWCASE_API_URL}"
      method: POST
      path: /v1/payments

  response:
    resource: Payment
    map:
      paymentId: "$.paymentId"
      bookingId: "$.bookingId"
      status: "$.status"
      amount: "$.amount"
      paidAt: "$.paidAt"
